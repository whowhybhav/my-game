let ac;function beep(f,d,t='square',v=.05){if(mute||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

function step(){
 frame++;
 const zr=lv.zones.some(z=>P.x+10>z.x&&P.x+10<z.x+z.w);

 for(const s of lv.solids)if(s.trig&&!s.gone&&P.x>s.trig){s.gone=1;fx=7;burst(s.x+s.w/2,320,T.a,16);beep(160,.15,'sawtooth',.05)}
 const tg=(((zr?k.l:k.r)?1:0)-((zr?k.r:k.l)?1:0))*4.4;P.vx=lv.ice?P.vx+(tg-P.vx)*.07:tg;const gv=lv.gz.some(z=>P.x+10>z.x&&P.x+10<z.x+z.w)?-1:1;
 cy=P.on?6:cy-1;if(jb>0)jb--;if(jb>0&&cy>0){P.vy=-9.6*gv;jb=0;cy=0;beep(400,.06,'square',.03)}
 P.vy+=.5*gv;P.on=false;
 P.x+=P.vx;
 for(const s of lv.solids){if(s.gone||!hit(P,s))continue;if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w}
 P.y+=P.vy;
 for(const s of lv.solids){if(s.gone||!hit(P,s))continue;
  if((P.vy>0)==(gv>0)){P.y=gv>0?s.y-P.h:s.y+s.h;P.vy=0;P.on=true}
  else{P.y=gv>0?s.y+s.h:s.y-P.h;P.vy=0}}
 if(P.x<0)P.x=0;if(P.x>W-P.w)P.x=W-P.w;
 if(P.y>H+40||P.y<-60)return die();
 if(lv.lava){lv.lava.y-=lv.lava.v;if(P.y+P.h>lv.lava.y)return die()}
 for(const s of lv.spikes){if(P.x>s.trig)s.up=1;if(s.up&&s.sh<24)s.sh+=4;if(s.ch&&s.sh>=24)s.x+=Math.sign(P.x-s.x-s.w/2)*2.3;

 for(const d of lv.drops){if(!d.f&&P.x>d.x-d.td&&P.x<d.x+40){d.f=1;beep(300,.1,'triangle')}
  if(d.f&&d.dl>0)d.dl--;
  else if(d.f&&d.y+d.h<320){d.vy+=d.odd?.9:.6;d.y+=d.vy;if(d.y+d.h>=320){d.y=320-d.h;burst(d.x+14,318,'#ddd',8);beep(90,.15,'sawtooth',.06)}}
  if(hit(P,{x:d.x+4,y:d.y,w:d.w-8,h:d.h}))return die()}
 for(const s of lv.saws){s.x+=s.v;if(s.x<s.min||s.x>s.max)s.v=-s.v;if(hit(P,{x:s.x-s.r+3,y:s.y-s.r+3,w:s.r*2-6,h:s.r*2-6}))return die()}
 for(const b of lv.bats){if(b.off)continue;
  if(b.d){b.x+=b.dx;b.y+=b.dy}else{b.x+=b.vx;b.y=b.by+Math.sin(frame/12+b.ph)*b.amp;
   if(b.dive&&b.x>P.x&&b.x-P.x<170&&b.x<W){b.d=1;b.dx=(P.x-b.x)/22;b.dy=(P.y-b.y)/22;beep(700,.12,'sawtooth',.04)}
   else if(b.x<-30&&!b.dive)b.x=700}
  if(b.x<-40||b.y>H+40||b.y<-40)b.off=1;
  if(hit(P,{x:b.x-10,y:b.y-6,w:20,h:12}))return die()}
 if(lv.chase){lv.chase.x+=lv.chase.v;if(P.x<lv.chase.x+24)return die()}
 for(const e of lv.exits){
  const t=e.dg&&e.dg[e.i|0];if(t&&Math.abs(P.x-e.x)<t.near&&Math.abs(P.y-e.y)<70){e.x=t.x;e.y=t.y;e.i=(e.i|0)+1;beep(900,.1,'triangle');burst(e.x+12,e.y+20,'#7dffb0',12)}

}
function draw(){
 const sc=cv.width/W;x.setTransform(sc,0,0,sc,0,0);x.save();if(fx>0){x.translate((Math.random()-.5)*fx,(Math.random()-.5)*fx);fx--}
 x.fillStyle=T.bg;x.fillRect(-10,-10,W+20,H+20);
 x.fillStyle=T.a;x.globalAlpha=.3;for(let i=0;i<26;i++){const sp=.3+(i%4)*.25,dy=T.dy||0,py=dy?(((i*53+frame*sp*dy)%320)+320)%320:(i*53)%320;x.fillRect((i*97+Math.sin(frame/40+i)*8)%W,py,2,2)}x.globalAlpha=1;
 for(const z of lv.gz){x.fillStyle='rgba(80,220,255,.13)';x.fillRect(z.x,0,z.w,320);x.fillStyle='rgba(150,240,255,.6)';x.font='22px system-ui';for(let i=0;i<z.w/45;i++)x.fillText('↑',z.x+12+i*45,((frame*2+i*70)%300)+20)}
 for(const z of lv.zones){const q=.5+.5*Math.sin(frame/8);x.fillStyle='rgba(160,90,255,.14)';x.fillRect(z.x,0,z.w,320);for(const px of[z.x,z.x+z.w]){x.fillStyle='rgba(200,140,255,'+(.5+.4*q)+')';x.fillRect(px-4,0,8,320);x.fillStyle='#fff';x.fillRect(px-1,0,2,320)}x.fillStyle='rgba(215,170,255,.85)';x.font='bold 16px system-ui';x.textAlign='center';x.fillText('⇄ SWAP',z.x+z.w/2,60);x.font='bold 26px system-ui';x.fillText('⇄',z.x+z.w/2,300);x.textAlign='left'}
 for(const s of lv.solids){if(s.gone)continue;
  if(s.v){x.globalAlpha=.75+.25*Math.sin(frame/4);x.fillStyle='#4a4270';x.fillRect(s.x,s.y,s.w,s.h);x.strokeStyle='#b7a8ff';x.setLineDash([6,6]);x.strokeRect(s.x+1,s.y+1,s.w-2,s.h-2);x.setLineDash([]);x.globalAlpha=1}
  else{x.fillStyle=T.g;x.fillRect(s.x,s.y,s.w,s.h);x.fillStyle=T.t;x.fillRect(s.x,s.y,s.w,4);
   if(s.trig&&!s.hid){x.strokeStyle='#1d1a2b';x.lineWidth=2;x.beginPath();for(let i=0;i<3;i++){x.moveTo(s.x+10+i*20,s.y);x.lineTo(s.x+16+i*20,s.y+14);x.lineTo(s.x+8+i*20,s.y+26)}x.stroke();x.lineWidth=1}}}
 x.fillStyle=T.sp;
 for(const s of lv.spikes){x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x+s.w/2,s.y+(s.c?s.sh:-s.sh));x.lineTo(s.x+s.w,s.y);x.fill()}
 x.fillStyle='#e8e8f0';
 for(const d of lv.drops){const o=d.odd&&!d.f;x.fillStyle=o?'#ffb3c6':T.sp;const w=o?Math.sin(frame/2)*1.5:0;x.beginPath();x.moveTo(d.x+w,d.y);x.lineTo(d.x+d.w+w,d.y);x.lineTo(d.x+d.w/2+w,d.y+d.h);x.fill()}
 for(const s of lv.saws){x.fillStyle=T.sw;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();x.strokeStyle='#e74c3c';x.lineWidth=3;x.beginPath();const a=frame/3;x.moveTo(s.x-Math.cos(a)*s.r,s.y-Math.sin(a)*s.r);x.lineTo(s.x+Math.cos(a)*s.r,s.y+Math.sin(a)*s.r);x.stroke();x.lineWidth=1}
 for(const b of lv.bats){if(b.off)continue;const f=Math.sin(frame/3)*7;x.fillStyle=b.dive?'#ff6b8b':'#7ea6ff';x.beginPath();x.ellipse(b.x,b.y,8,6,0,0,7);x.fill();x.beginPath();x.moveTo(b.x-6,b.y);x.lineTo(b.x-18,b.y-8+f);x.lineTo(b.x-4,b.y+4);x.moveTo(b.x+6,b.y);x.lineTo(b.x+18,b.y-8+f);x.lineTo(b.x+4,b.y+4);x.fill();x.fillStyle='#fff';x.fillRect(b.x-4,b.y-2,2,2);x.fillRect(b.x+2,b.y-2,2,2)}
 if(lv.lava){x.fillStyle='#ff5a1f';x.beginPath();x.moveTo(0,H);for(let i=0;i<=W;i+=20)x.lineTo(i,lv.lava.y+Math.sin(i/30+frame/10)*4);x.lineTo(W,H);x.fill()}
 if(lv.chase){x.fillStyle='#c0392b';x.fillRect(lv.chase.x-20,0,44,320)}
 for(const e of lv.exits){x.fillStyle='#4fa86b';x.fillRect(e.x,e.y,e.w,e.h);
  if(e.dg&&(e.i|0)<e.dg.length){x.strokeStyle='#fff';x.setLineDash([4,4]);x.strokeRect(e.x,e.y,e.w,e.h);x.setLineDash([])}
  if(!e.fake){x.fillStyle='#fff';x.fillRect(e.x+e.w-8,e.y+20,4,4)}}
 x.fillStyle=P.zr?'#c9a0ff':'#ffb347';x.fillRect(P.x,P.y,P.w,P.h);x.fillStyle='#222';x.fillRect(P.x+4,P.y+5,4,4);x.fillRect(P.x+12,P.y+5,4,4);

function endScreen(){const sc=cv.width/W;x.setTransform(sc,0,0,sc,0,0);x.fillStyle=T.bg;x.fillRect(0,0,W,H);x.fillStyle='#ffd166';x.textAlign='center';x.font='28px system-ui';
 x.fillText('You escaped Devil Calling Hell! 😈',W/2,150);x.font='18px system-ui';x.fillStyle='#fff';

let last=0,acc=0;
function loop(t){const dt=Math.min(t-last,100);last=t;
 if(!document.hidden&&!paused){if(done)endScreen();else{acc+=dt;let n=0;while(acc>=16.667&&n++<4){step();acc-=16.667}if(n>=4)acc=0;draw()}}

const map={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'j',w:'j',W:'j',' ':'j',z:'j',Z:'j'};

 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up))});

addEventListener('blur',rel);document.addEventListener('visibilitychange',rel);

 for(let i=0;i<LV.length;i++){const t=thI(i),C=TH[t];if(t!==w){if(w>=0)h+='</div>';w=t;h+='<div class="wh" style="color:'+C.a+'">'+C.n.toUpperCase()+' WORLD</div><div class="lg">'}

 $('mlist').innerHTML=h+'</div>'}
