const DEVIL_HINTS=["Run right and jump the two broken-floor gaps. Land cleanly on each next platform; the exit is the green door on the far right.","Sprint toward the spike, then jump as soon as its tip starts growing. Do not stop after landing; keep moving right until the exit.","Keep a steady run. Jump the first spike, keep running while the gate chases from behind, then jump the second spike and take the exit.","Approach the dashed door to make it move, then follow its new position. Keep moving right when it wakes and jumps away; jump as needed to stay ahead of the hunting door.","Ignore the fake green door at the left. Stay moving right, use small jumps to evade the two awakened doors, and enter the real exit at the far right.","Cross the disappearing floors one jump at a time. Jump the spike, watch the falling pink hazard, and keep moving so the awakened gate cannot catch you before the right exit.","Enter the purple swap zone, then remember the controls reverse. While inside, press LEFT to keep moving right. Jump the pit immediately after the swap and continue to the exit.","Do not trust the floor. Two tiles vanish after you approach them. Keep your speed up and jump across the missing sections instead of committing to a disappearing tile.","Use the control-swap zone to cross the gap: inside purple, your LEFT input moves you right. Keep moving because the red wall is chasing from behind, then jump onto the right platform.","Keep running under the falling hazards. Learn the warning position of each stalactite, then make short jumps past x≈220, 400 and 480 while continuing toward the exit.","Watch the saws' patrol ranges and jump over them on their return passes. Keep moving right while the Devil gate closes in from behind; do not get trapped between a saw and the exit.","Stay low when the normal bats pass, then jump when the pink bat dives. Keep moving right so the awakened gate remains behind you; use short jumps rather than stopping.","Watch the ceiling for the falling spikes. Trigger each drop while still moving, then slip past it before the next one. Keep the right side clear for the exit.","Ice means momentum. Start braking early before the first spike, jump the gap, then use the same rhythm for the second spike and land on the final platform without over-sliding.","Stay on the ice and watch the ceiling tells. Keep moving right, jump each falling icicle after it starts, and avoid long stops because the ice carries you farther than expected.","Climb the ledges as quickly as possible. Jump from one rising platform to the next; the lava only gives you a small timing window, so commit to each jump early.","Take the steps upward without hesitating. The top platform is the goal; after the last jump, avoid the diving bat and move straight into the upper-right exit.","Enter the cyan gravity field to get pulled onto the ceiling. Stay on the ceiling while crossing the field, dodge the saw with a jump down, then return to the exit route.","This is the full mixed test. Handle the control-swap zone first, clear the disappearing floors, jump the saw, dodge the falling pink hazard and keep moving to the right exit.","Climb the ice steps with small controlled inputs. Because you slide, release RIGHT before each landing so momentum does not carry you off the next ledge.","Let yourself slide downhill, but jump each spike before your momentum carries you into it. Keep advancing; the hunting gate is defeated by continuous forward movement, not stopping.","Stay on the ice while the bats sweep over you. Use short jumps for the diving pink bat, then continue right instead of waiting for every hazard to pass.","Commit to each slide early. Use the safe spaces between the two saw patrols, jump over a saw only when it enters your lane, and keep the final platform in sight.","Treat every broken section as temporary. Jump before the ice tile disappears, land on the next solid section, and immediately prepare for the following gap.","Four icicles are spaced across the route. Move under each warning point, then jump once the spike starts dropping. The pink one is the unpredictable one, so give it extra space.","Inside the purple field the controls reverse. Enter with room to spare, use LEFT to continue right, and do not overcorrect on the slippery ice. Exit the zone before the spike.","Keep pushing right. The red wall is close, the ice increases drift, and the spike blocks the lower route. Brake before the spike, jump it, then accelerate again.","Use small jumps up the glacier steps. Clear the first spike before landing on the next ledge, then repeat; do not let the lava-like floor pressure make you rush a bad jump.","Handle the hazards in order: falling spike, ice footing, saw, then diving bat. Keep every movement deliberate and use the wide platforms to reset your footing.","Jump from ledge to ledge while the lava rises. The ladder is steep, so release RIGHT early near each platform to avoid sliding or overshooting the next step.","Never plan to go backward. Each crumbling step disappears after you leave it, so jump forward in a single sequence and land safely on the final solid platform.","Keep climbing while dodging the falling embers. Each drop gives you a warning; trigger it while moving, then jump through the gap and continue upward.","There is a saw on every section. Time your jumps so the saw is moving away from your landing point, then immediately commit to the next platform before the lava rises.","In the purple zone, LEFT makes you run right. Enter while centered, hold the corrected direction through the swap, and keep moving until you are past the zone.","This is a straight escape. Climb the platforms immediately while the red wall advances behind you. Do not backtrack and do not stop on a ledge.","Use the cyan field to flip onto the ceiling, cross above the lava, and avoid the ceiling saw. After clearing the field, return to the ground route and take the exit.","Treat the platforms like hopscotch: jump right, land, jump right, then make the higher final jump. Do not assume every next platform is higher; follow the exact staircase pattern.","The steps crumble, the lava rises, the bat dives and the pink drop falls. Keep a fixed rhythm: jump forward, land, jump again; never turn back for a missed platform.","This is a pure speed climb. Start moving immediately, chain the jumps with minimal hesitation, and use the large final platform to make the exit safely above the lava.","Enter the cyan zone and flip to the ceiling. Jump away from the hanging spikes when they line up with you, then keep moving across the ceiling until gravity returns.","The saws patrol the ceiling. Flip up, watch their motion, then jump down to the ground when a saw blocks your lane and jump back up after it passes.","Use the cyan field to float across the pit. Stay inside it so gravity keeps you on the ceiling, dodge the ceiling saw, then leave the field only after you are over solid ground.","The cyan fields are short gravity bursts. Enter each one, flip, immediately dodge the hanging spike with a small jump, then continue to the next zone before falling.","The ceiling is useful here. Flip up in the cyan field to avoid the middle bats, then make a small jump when the diving pink bat crosses your lane and continue right.","The ceiling has holes. Use the cyan field when it helps, but drop to the floor before each missing ceiling section, then flip back up after the gap is behind you.","Two ceiling pillars block the upper route. Flip to the ceiling, then drop to the ground before the first pillar, stay low under it, and repeat for the second before flipping back up.","Ice makes the ceiling slippery too. Flip up in the cyan zone, brake early before each hanging spike, and use short downward jumps to recover when momentum gets too high.","This combines upside-down movement and swapped controls. Enter the cyan field, remember LEFT still moves you right only inside the purple zone, and use a small jump to clear the ceiling spike.","Keep moving while the red wall follows. Flip to the ceiling, jump away from the hanging spikes as the hunter gets close, then keep running right until the exit.","Float across the black-hole pit inside the cyan zone. Dodge the ceiling saw first, then the diving bat, and do not leave the gravity field until you are safely over the far platform."];
