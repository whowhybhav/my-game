<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090f"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Not Again!</title>
<style>
:root{--bg:#09090f;--card:#14121c;--bd:rgba(255,255,255,.08);--tx:#f4f2fa;--mut:#8a86a0;--pk:#ff4d6d;--vi:#8b5cf6;--mint:#2ee6a6;--sun:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(640px 380px at 50% -90px,rgba(139,92,246,.24),transparent),radial-gradient(520px 320px at 90% 105%,rgba(255,77,109,.1),transparent)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* Device Rotation Prompt */
#rotate-msg { display: none; position: fixed; inset: 0; z-index: 999; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
#rotate-msg h2 { color: var(--pk); margin-top: 20px; margin-bottom: 10px; font-size: 28px; }
#rotate-msg p { color: var(--mut); font-size: 16px; }
@media (orientation: portrait) and (max-width: 900px) {
  body.touch #rotate-msg { display: flex; }
  body.touch .scr { display: none !important; }
}

.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y}
.scr.on{display:flex}
.bar{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--vi);font-weight:700}
.pill{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 14px;font-size:13px;margin-left:6px}
.card{width:min(560px,100%);background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:30px 22px 24px;text-align:center;box-shadow:0 30px 60px -40px #000}
.mx{width:50px;height:50px;border-radius:16px;background:var(--sun);position:relative;margin:0 auto 18px;box-shadow:0 0 36px -6px rgba(255,209,102,.55);animation:mx 7s infinite}
.mx:before{content:"absolute";left:13px;top:19px;width:6px;height:10px;border-radius:3px;background:#1b1830;box-shadow:18px 0 0 #1b1830}
@keyframes mx{0%,70%{transform:none;opacity:1}76%{transform:translateY(80px) rotate(40deg);opacity:0}77%{transform:translateY(-30px);opacity:0}90%,100%{transform:none;opacity:1}}
h1{font-weight:800;font-size:clamp(44px,12vw,74px);line-height:1;letter-spacing:-2.5px;margin:0}
h1 i{color:var(--pk);font-style:normal}
.sub{color:var(--mut);margin:12px 0 24px;font-size:16px}
.btn{border:0;border-radius:16px;background:var(--pk);color:#fff;font-weight:700;font-size:16px;letter-spacing:.04em;padding:15px 44px;box-shadow:0 14px 34px -12px rgba(255,77,109,.75);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:none;color:var(--mut);box-shadow:none;font-size:14px;padding:11px 14px}
.fn{margin-top:16px;font-size:12px;color:#5f5b75}
#wl{width:min(560px,100%)}
.wc{width:100%;display:block;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px 20px;margin-top:12px;transition:transform .15s,border-color .15s}
.wc:active:not(:disabled){transform:scale(.99)}.wc:not(:disabled):hover{border-color:rgba(255,255,255,.16)}
.wc:disabled{opacity:.45}
.wh{display:flex;align-items:baseline;gap:10px}.wh b{font-size:19px;flex:1}
.wl{font-size:11px;letter-spacing:.18em;font-weight:700}.wp{color:var(--mut);font-size:13px}
.wc small{display:block;color:var(--mut);margin-top:6px;font-size:14px}
.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.ch span{border:1px solid var(--bd);border-radius:999px;padding:5px 10px;font-size:12px;color:#cfcbe0}
.pg{height:4px;background:rgba(255,255,255,.07);border-radius:4px;margin-top:14px;overflow:hidden}.pg i{display:block;height:100%;background:var(--mint)}
.top{width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.top h2{margin:0;font-size:18px}
.ic{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.lg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(560px,100%);margin-top:24px}
.lb{aspect-ratio:1;border-radius:16px;border:1px solid var(--bd);background:var(--card);font-weight:700;font-size:20px}
.lb.dn{border-color:var(--mint);color:var(--mint)}.lb:disabled{opacity:.3}

/* Fix: added width:100% and height:100% */
#gm{padding:0;overflow:hidden;touch-action:none;position:relative;width:100%;height:100%}

#hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:10}
#hud .ic{pointer-events:auto;width:36px;height:36px;font-size:16px;background:rgba(20,18,28,.6);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);color:#fff}

/* Fix: added height:100% */
#st{flex:1;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
canvas{border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 60px -28px #000;display:block}

/* Touch Controls Layout */
#pd{display:none;position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:10}
body.touch #pd{display:flex}
#pd > *{pointer-events:auto}
.gp{display:flex;gap:14px}
.pb{width:76px;height:68px;border-radius:16px;border:2px solid rgba(255,255,255,.15);background:rgba(20,18,28,.4);color:rgba(255,255,255,.6);font-size:24px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background .1s, border-color .1s, color .1s}
.pb.on{background:rgba(46,230,166,.15);border-color:var(--mint);color:var(--mint)}

#cfm{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(5,5,9,.7);backdrop-filter:blur(5px)}
#cfm.show{display:flex}
#cc{width:min(88vw,340px);background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px 22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;touch-action:auto}
#cc h2{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}#cc p{margin:0 0 18px;color:var(--mut);line-height:1.45}
</style></head><body>

<div id="rotate-msg">
  <div class="mx"></div>
  <h2>Rotate Device</h2>
  <p>Please flip your phone to landscape to play.</p>
</div>

<div class="scr on" id="home"><div class="bar"><span class="eyebrow">Early build</span><span><button class="pill" id="snd"></button><button class="pill" id="rs">Reset</button></span></div><div class="card"><div class="mx"></div><h1>Not Again<i>!</i></h1><p class="sub">A tiny game that lies to you.</p><button class="btn" id="play">Play</button><div class="fn">Works offline · Nothing to install</div></div><div id="wl"></div></div>
<div class="scr" id="lv"><div class="top"><button class="ic" id="bk1" aria-label="Back">←</button><h2 id="lt"></h2><span style="width:42px"></span></div><div class="lg" id="lg"></div></div>
<div class="scr" id="gm">
  <div id="hud"><button class="ic" id="bk2" aria-label="Menu">←</button><button class="ic" id="rst" aria-label="Restart">↻</button></div>
  <div id="st">
    <canvas id="c"></canvas>
    <div id="pd">
      <div class="gp">
        <button class="pb" data-k="l">◀</button>
        <button class="pb" data-k="r">▶</button>
      </div>
      <button class="pb" data-k="j">▲</button>
    </div>
  </div>
</div>
<div id="cfm"><div id="cc"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),x=cv.getContext('2d'),W=640,H=360;
// ===== THEMES =====
const TH=[{bg:'#0c0c14',sol:'#35335c',ac:'#8b5cf6'},{bg:'#0a1118',sol:'#22425a',ac:'#38bdf8'},{bg:'#120b13',sol:'#533049',ac:'#f472b6'},{bg:'#0d0a18',sol:'#40377f',ac:'#a78bfa'},{bg:'#050507',sol:'#d9d4ee',ac:'#ff4d6d'}];
const WN=[{n:'Training Hell',d:'Simple traps.'},{n:'Trust Issues',d:'Platforms disappear.'},{n:"You're Not Safe",d:'Fake checkpoints.'},{n:'Why Did I Do This?',d:'Invisible traps.'},{n:'Pure Evil',d:'Everything lies to you.'}];
let TT=TH[0],sv={d:0,m:0,w:WN.map(()=>Array(10).fill(0))};
try{const q=JSON.parse(localStorage.getItem('na1'));if(q&&q.w)sv=Object.assign(sv,q)}catch(e){}
const save=()=>{try{localStorage.setItem('na1',JSON.stringify(sv))}catch(e){}};

// ===== SOUND =====
let ac;const snd=t=>{if(sv.m)return;try{ac=ac||new AudioContext();if(ac.state=='suspended')ac.resume();const n=ac.currentTime,[a,b,d,w]=[
  [420,640,.09,'sine'],     // 0: Jump
  [220,70,.28,'triangle'],  // 1: Die
  [320,640,.4,'triangle'],  // 2: Win (Warm Sweep)
  [500,520,.04,'sine']      // 3: Menu
][t],o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(b,n+d);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}};

// ===== LEVEL-DESIGN SYSTEM =====
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,
onTop=(o,P)=>P.on&&P.x+P.w>o.x&&P.x<o.x+o.w&&Math.abs(P.y+P.h-o.y)<2,
rr=(a,b,c,d,r,f)=>{x.fillStyle=f;x.beginPath();x.roundRect(a,b,c,d,r);x.fill()},
tri=(a,b,w,h,c)=>{x.fillStyle=c;x.beginPath();x.moveTo(a,b);x.lineTo(a+w/2,b-h);x.lineTo(a+w,b);x.fill()};

const M={
solid:{cat:'base',s:o=>o,d:o=>{rr(o.x,o.y,o.w,o.h,6,TT.sol);rr(o.x+2,o.y,o.w-4,3,2,'rgba(255,255,255,.22)')}},
spike:{cat:'base',h:o=>({x:o.x+3,y:o.y+7,w:o.w-6,h:o.h-7}),d:o=>{for(let i=0;i<o.w;i+=18)tri(o.x+i,o.y+o.h,18,o.h,'#ff4d6d')}},
fall:{cat:'trap',s:o=>o.st<2?o:null,u:(o,P)=>{if(!o.st&&(o.pre?P.x+P.w>o.x-o.pre&&P.x<o.x+o.w:onTop(o,P)))o.st=1;if(o.st==1&&++o.t>o.dl)o.st=2;if(o.st==2){o.vy+=.6;o.y+=o.vy}},d:o=>{if(o.y>H+20)return;x.globalAlpha=o.st==2?.6:1;rr(o.x+(o.st==1?Math.sin(o.t*2)*1.5:0),o.y,o.w,o.h,6,TT.sol);x.globalAlpha=1}},
fake:{cat:'trap',u:(o,P)=>{if(ov(P,o))o.rv=1},d:o=>{x.globalAlpha=o.rv?.3:1;rr(o.x,o.y,o.w,o.h,6,TT.sol);x.globalAlpha=1;if(o.tell){x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=2;x.setLineDash([5,5]);x.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);x.setLineDash([])}}},
wall:{cat:'trap',s:o=>o,u:(o,P)=>{if(ov({x:P.x-2,y:P.y,w:P.w+4,h:P.h},o))o.f=45;else if(o.f>0)o.f--},d:o=>{if(o.f>0){x.globalAlpha=Math.min(1,o.f/30);rr(o.x,o.y,o.w,o.h,6,'#ff4d6d');x.globalAlpha=1}}},
msp:{cat:'trap',u:o=>{o.x+=o.v;if(o.x<o.x1||o.x>o.x2)o.v=-o.v},h:o=>({x:o.x+3,y:o.y+7,w:o.w-6,h:o.h-7}),d:o=>tri(o.x,o.y+o.h,o.w,o.h,'#c9184a')},
dsp:{cat:'trap',u:(o,P)=>{if(!o.ar&&Math.abs(P.x+10-o.x-o.w/2)<o.r&&P.y>o.y-90)o.ar=1;if(o.ar){o.t++;o.u=Math.max(0,Math.min(1,(o.t-o.dl)/4))}},h:o=>o.u>.5?{x:o.x+3,y:o.y+o.h*(1-o.u)+6,w:o.w-6,h:o.h*o.u-6}:null,d:o=>{x.strokeStyle='rgba(239,71,111,'+(o.ar?.8:.3)+')';x.lineWidth=2;x.beginPath();x.moveTo(o.x+4,o.y+o.h+1);x.lineTo(o.x+o.w-4,o.y+o.h+1);x.stroke();if(o.u>0)tri(o.x,o.y+o.h,o.w,o.h*o.u,'#ff4d6d')}},
pole:{cat:'trap',s:o=>o,u:(o,P)=>{if(onTop(o,P)){P.vy=-16;jb=0;snd(0)}},d:o=>{rr(o.x,o.y,o.w,o.h,6,'#8b5cf6');rr(o.x,o.y,o.w,12,4,'#ffd166')}},
force:{cat:'move',s:o=>o,u:(o,P)=>{if(onTop(o,P)){P.x+=o.v}},d:o=>{rr(o.x,o.y,o.w,o.h,6,TT.sol);x.save();x.clip(new Path2D(`M${o.x},${o.y} h${o.w} v${o.h} h-${o.w} Z`));x.fillStyle='rgba(0,0,0,0.3)';let d=o.v>0?1:-1;let off=(fr*d)%15;if(off<0)off+=15;for(let i=-15;i<o.w;i+=15){x.fillRect(o.x+i+off,o.y,8,o.h)}x.restore()}},
vanish:{cat:'env',s:o=>o.t<45?o:null,u:(o,P)=>{if(o.t===0&&onTop(o,P))o.t=1;if(o.t>0&&o.t<75)o.t++;if(o.t>=75)o.t=0},d:o=>{if(o.t<45){x.globalAlpha=1-(o.t/45);rr(o.x,o.y,o.w,o.h,6,'#38bdf8');x.globalAlpha=1}}},
fakedoor:{cat:'mind',h:o=>({x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-8}),d:o=>{rr(o.x,o.y,o.w,o.h,[13,13,3,3],'#ff4d6d');x.fillStyle='#fff';x.beginPath();x.arc(o.x+19,o.y+24,2.5,0,7);x.fill()}}
};

// helpers
const GR=(a,b)=>({k:'solid',x:a,y:320,w:b-a,h:40}),PF=(a,y,w)=>({k:'solid',x:a,y,w,h:14}),
SP=(a,n)=>({k:'spike',x:a,y:302,w:n*18,h:18}),FALL=(a,w,dl=22,pre=0)=>({k:'fall',x:a,y:320,w,h:16,st:0,t:0,vy:0,dl,pre}),
FAKE=(a,w,tell)=>({k:'fake',x:a,y:320,w,h:40,tell}),WALL=(a,h)=>({k:'wall',x:a,y:320-h,w:16,h,f:0}),
MSP=(a,b,v)=>({k:'msp',x:a,y:302,w:24,h:18,x1:a,x2:b,v}),DSP=(a,r,dl)=>({k:'dsp',x:a,y:302,w:28,h:18,r,dl,ar:0,t:0,u:0}),
POLE=(a,y,h)=>({k:'pole',x:a,y:y-h,w:20,h:h}),FORCE=(a,y,w,v)=>({k:'force',x:a,y,w,h:16,v}),
VANISH=(a,y,w)=>({k:'vanish',x:a,y,w,h:14,t:0}),FAKEDOOR=(a,y=280)=>({k:'fakedoor',x:a,y,w:26,h:40}),
DOOR=(a,y=280)=>({x:a,y,w:26,h:40});

// ===== WORLD 1 - TRAINING HELL =====
const LV=[
()=>({n:'Mix n Match',o:[GR(0,180), VANISH(200,260,60), POLE(280,320,50), FORCE(340,320,100,-2), FAKEDOOR(460), GR(510,640)], d:DOOR(580)}),
()=>({n:'Conveyor Panic',o:[GR(0,100), FORCE(100,320,120,3.5), SP(220,2), FORCE(260,320,100,-3), FAKEDOOR(380), VANISH(410,240,50), GR(480,640)], d:DOOR(570)}),
()=>({n:'Leap of Faith',o:[GR(0,120), FAKE(120,60,1), POLE(210,320,80), VANISH(260,180,60), WALL(350,140), GR(400,640)], d:DOOR(580)}),
()=>({n:'Watch your Step',o:[GR(0,80), FALL(80,50), FORCE(130,320,80,2.5), DSP(210,50,10), VANISH(280,240,40), POLE(360,320,30), GR(420,640)], d:DOOR(560)}),
()=>({n:'Illusion',o:[GR(0,150), FAKEDOOR(100), VANISH(160,250,50), FAKE(230,80,1), POLE(330,320,70), FORCE(390,200,60,3), GR(470,640)], d:DOOR(580)}),
()=>({n:'Don\'t Stop',o:[GR(0,120), MSP(120,240,2), VANISH(250,260,50), POLE(320,320,40), FORCE(380,210,80,-2.5), FAKEDOOR(470), GR(510,640)], d:DOOR(590)}),
()=>({n:'Rising Tension',o:[GR(0,120), FALL(120,60), POLE(190,320,90), VANISH(230,160,50), FORCE(300,280,80,4), DSP(390,60,10), GR(450,640)], d:DOOR(580)}),
()=>({n:'Mind Games',o:[GR(0,150), FAKE(150,80,0), FAKEDOOR(180), VANISH(250,230,40), FORCE(310,320,100,-4.5), WALL(430,90), POLE(450,320,30), GR(520,640)], d:DOOR(590)}),
()=>({n:'The Gauntlet',o:[GR(0,100), POLE(120,320,50), VANISH(170,180,50), FORCE(240,320,90,3), MSP(340,430,2.5), FAKE(450,60,1), FAKEDOOR(520), GR(540,640)], d:DOOR(600)}),
()=>({n:'Hell\'s Exam',o:[GR(0,60), FORCE(60,320,60,4), FALL(120,40), POLE(180,320,60), VANISH(220,180,40), DSP(280,50,8), FAKE(330,50,1), WALL(400,100), FAKEDOOR(430), FORCE(470,220,80,-3), GR(570,640)], d:DOOR(590, 180)})];

// ===== ENGINE =====
let wi=0,ci=0,lv,P,ph,pt=0,k={},jb=0,co=0,lvd=0,parts=[],fr=0,shk=0,scr='home';
function start(i,keep){ci=i;if(!keep)lvd=0;lv=LV[i]();TT=TH[wi];P={x:40,y:300,w:20,h:20,vx:0,vy:0,on:0};ph='play';pt=0;parts=[];}
function die(){if(ph!='play')return;ph='dead';pt=0;lvd++;sv.d++;save();snd(1);shk=8;for(let i=0;i<22;i++)parts.push({x:P.x+10,y:P.y+10,vx:(Math.random()-.5)*7,vy:(Math.random()-.9)*7,l:40});}
function win(){if(ph!='play')return;ph='win';pt=0;snd(2)}
function next(){sv.w[wi][ci]=1;save();if(ci<9)start(ci+1);else{ph='done';ask('World cleared','Training Hell is behind you. Trust Issues arrives in the next part.',[['Back to menu',()=>home(),1]])}}
function step(){
 const dir=(k.r?1:0)-(k.l?1:0);
 P.vx+=(dir*4.5-P.vx)*(dir?.35:.4); 
 P.vy=Math.min(P.vy+.65,14);       
 if(jb>0)jb--;co=P.on?6:Math.max(0,co-1);
 if(jb&&co){P.vy=-11.5;jb=0;co=0;snd(0)} 
 if(!k.j&&P.vy<-4)P.vy+=1;
 const so=()=>lv.o.map(o=>{const m=M[o.k];return m.s&&m.s(o)}).filter(Boolean);
 P.x+=P.vx;for(const s of so())if(ov(P,s)){if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;P.vx=0}
 P.x=Math.max(0,Math.min(W-P.w,P.x));P.on=0;P.y+=P.vy;
 for(const s of so())if(ov(P,s)){if(P.vy>0){P.y=s.y-P.h;P.on=1}else P.y=s.y+s.h;P.vy=0}
 for(const o of lv.o){const m=M[o.k];m.u&&m.u(o,P)}
 if(P.y>H+30)return die();
 for(const o of lv.o){const m=M[o.k],h=m.h&&m.h(o);if(h&&ov(P,h))return die()}
 if(ov(P,lv.d))win()}
function tick(){fr++;if(shk>0)shk--;
 if(ph=='dead'){if(++pt>44)start(ci,1)}else if(ph=='win'){if(++pt>36)next()}else if(ph=='play')step()}
 
function draw(){const sc=cv.width/W;x.setTransform(sc,0,0,sc,0,0);x.save();if(shk>0)x.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);
 x.fillStyle=TT.bg;x.fillRect(-10,-10,W+20,H+20);
 
 x.fillStyle='rgba(255,255,255,0.02)';
 x.font='800 90px system-ui,sans-serif';
 x.textAlign='center';
 x.fillText('LEVEL '+(ci+1), W/2, H/2+30);
 x.textAlign='left';

let last=0,acc=0;function loop(t){const dt=Math.min(t-last,100);last=t;if(scr=='gm'&&lv){acc+=dt;let n=0;while(acc>=16.667&&n++<4){tick();acc-=16.667}if(n>=4)acc=0;draw()}requestAnimationFrame(loop)}
